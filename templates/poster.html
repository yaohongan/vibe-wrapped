<!doctype html>
<html lang="zh-CN" class="{{theme}} {{shape}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>{{title}}</title>
<style>
{{fonts}}
{{css}}
:root{--bg:{{bg}};--bg2:{{bg2}};--accent:{{accent}};--h:{{height}}px}
</style>
</head>
<body>
<div class="poster" id="poster">
{{body}}
</div>
<script>
/* 文字溢出时自动缩字号（只在 data-fit 元素上生效） */
document.fonts && document.fonts.ready.then(fit); window.addEventListener('load', fit);
function fit(){
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var size = parseFloat(getComputedStyle(el).fontSize), min = size * 0.5, n = 0;
    while (el.scrollWidth > el.clientWidth + 1 && size > min && n++ < 80) {
      size -= 2; el.style.fontSize = size + 'px';
    }
  });
  /* 内容超出画布时整体等比缩小（同时放宽宽高），保证页脚不被裁掉 */
  var p = document.getElementById('poster'), H = {{height}}, W = 1080, z = 1;
  p.style.zoom = 1;
  while (p.scrollHeight > H + 1 && z > 0.72) {
    z = Math.round((z - 0.02) * 100) / 100;
    p.style.zoom = z; p.style.width = (W / z) + 'px'; p.style.height = (H / z) + 'px';
  }
  document.documentElement.setAttribute('data-zoom', z);
  document.documentElement.setAttribute('data-ready','1');
}
</script>
</body>
</html>
